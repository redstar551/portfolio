<!DOCTYPE html>
<html lang="ja" data-title-en="Contact — Daigo Sakane">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Daigo Sakane</title>
<meta name="description" content="映像作家・坂根大悟へのお問い合わせフォーム。">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Daigo Sakane">
<meta property="og:title" content="Contact — Daigo Sakane">
<meta property="og:description" content="映像作家・坂根大悟へのお問い合わせフォーム。">
<meta property="og:url" content="https://daigosakane.com/contact">
<meta property="og:image" content="https://daigosakane.com/images/og/index.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@400;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #062C54; --accent: #4A9EFF;
  --black: #0A0A0A; --white: #F0ECE3; --cream: #E8E0D0; --grey: #888;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'Space Mono', monospace;
  --font-jp: 'Noto Sans JP', sans-serif;
  --font-dot: 'DotGothic16', sans-serif;
}
html { scroll-behavior: smooth; }
body { background: var(--black); color: var(--white); font-family: var(--font-body); font-size: 14px; line-height: 1.6; overflow-x: hidden; }
::selection { background: var(--navy); color: var(--white); }
a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--white); }
/* 言語切り替え：<html lang> に応じて日本語版と英語版を出し分ける */
.lang-en { display: none; }
html[lang="en"] .lang-ja { display: none; }
html[lang="en"] .lang-en { display: revert; }
.lang-toggle { font-family: var(--font-display), var(--font-jp); font-size: 15px; letter-spacing: 2px; color: rgba(240,236,227,0.45); background: transparent; border: 1px solid rgba(240,236,227,0.22); padding: 3px 10px; cursor: pointer; text-transform: uppercase; transition: border-color 0.3s, color 0.3s; }
.lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
.lang-toggle:focus-visible { outline: 1px solid var(--accent); }
.nav-right { display: flex; align-items: center; gap: 20px; }

.scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); opacity: 0.5; }

nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
nav .logo { font-family: var(--font-dot); font-weight: 400; font-size: 18px; letter-spacing: 4px; color: rgba(240,236,227,0.8); }
/* 名前の定期グリッチ：赤と水色を左右にずらす色収差 */
@keyframes logo-rgb { 0%{text-shadow:-2px 0 rgba(255,0,70,.85),2px 0 rgba(0,220,255,.85);transform:translateX(0)} 20%{text-shadow:3px 0 rgba(255,0,70,.85),-3px 0 rgba(0,220,255,.85);transform:translateX(1px)} 40%{text-shadow:-1px 0 rgba(255,0,70,.85),1px 0 rgba(0,220,255,.85);transform:translateX(-1px)} 60%{text-shadow:2px 1px rgba(255,0,70,.85),-2px -1px rgba(0,220,255,.85);transform:translateX(0)} 80%,100%{text-shadow:none;transform:none} }
nav .logo.rgb-glitch { display: inline-block; animation: logo-rgb 0.4s steps(1); }
nav .back-link { font-family: var(--font-display); font-size: 16px; letter-spacing: 3px; color: rgba(240,236,227,0.45); text-transform: uppercase; transition: color 0.3s; }
nav .back-link:hover { color: var(--accent); }

.contact-page { max-width: 900px; margin: 0 auto; padding: 60px 40px 100px; }
.contact-title { font-family: var(--font-display); font-size: clamp(48px, 10vw, 120px); letter-spacing: 6px; color: var(--white); text-transform: uppercase; line-height: 1; margin-bottom: 60px; position: relative; display: inline-block; }

.form-group { margin-bottom: 30px; border: 0; }
.form-legend, .form-label { display: block; font-family: var(--font-body); font-size: 12px; letter-spacing: 1px; color: var(--grey); margin-bottom: 8px; }
.form-sublabel { display: block; font-family: var(--font-body); font-size: 12px; letter-spacing: 1px; color: var(--grey); margin-bottom: 8px; }
.name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

.form-input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(240,236,227,0.25); color: var(--white); font-family: var(--font-jp); font-size: 15px; padding: 10px 0; border-radius: 0; outline: none; transition: border-color 0.25s; }
.form-input:focus { border-bottom-color: var(--accent); }
textarea.form-input { min-height: 160px; resize: vertical; line-height: 1.9; }

.form-submit { font-family: var(--font-display); font-size: 16px; letter-spacing: 3px; text-transform: uppercase; padding: 11px 34px; border: 1px solid rgba(240,236,227,0.35); background: transparent; color: rgba(240,236,227,0.75); cursor: pointer; transition: border-color 0.3s, color 0.3s; margin-top: 18px; }
.form-submit:hover { border-color: var(--accent); color: var(--accent); }
.form-submit:disabled { opacity: 0.5; cursor: wait; }
.form-status { margin-top: 24px; font-family: var(--font-jp); font-size: 14px; color: var(--cream); min-height: 1.6em; }
.form-status.error { color: #ff6b6b; }
.contact-note { margin-top: 60px; padding-top: 30px; border-top: 1px solid rgba(240,236,227,0.1); font-family: var(--font-jp); font-size: 14px; color: var(--cream); }
.contact-note a { font-family: var(--font-display); font-size: 16px; letter-spacing: 2px; }

footer { padding: 30px 40px; text-align: center; font-family: var(--font-body); font-size: 11px; letter-spacing: 3px; color: rgba(240,236,227,0.4); }

@media (max-width: 768px) {
  nav { padding: 16px 20px; }
  .contact-page { padding: 40px 20px 80px; }
  .contact-title { margin-bottom: 40px; }
  .name-row { grid-template-columns: 1fr; }
}
</style>
<script>try{if(localStorage.getItem("lang")==="en")document.documentElement.lang="en";}catch(e){}</script>
</head>
<body>
<div class="scanlines"></div>

<nav>
  <a href="index.html" class="logo">坂根大悟</a>
  <div class="nav-right">
    <a href="index.html" class="back-link">← Top</a>
    <button class="lang-toggle" type="button" aria-label="Switch language">EN</button>
  </div>
</nav>

<main class="contact-page">
  <h1 class="contact-title">Contact</h1>

  <!-- 送信先：FormSubmit（formsubmit.co）。有効化後に届く文字列でメールアドレス部分を置き換えて、アドレスを隠す -->
  <form id="contactForm" action="https://formsubmit.co/f8711e937496df3ed209b3562bec17b3" method="POST">
    <!-- FormSubmit の設定：メール件名（送信時に Subject 欄から組み立てる）、表形式の本文、スパム除け（人間には見えない入力欄） -->
    <input type="hidden" name="_subject" value="【ポートフォリオ】お問い合わせ">
    <input type="hidden" name="_template" value="table">
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
    <fieldset class="form-group">
      <div class="name-row">
        <div>
          <label class="form-sublabel" for="firstName">First Name</label>
          <input class="form-input" type="text" id="firstName" name="first_name" autocomplete="given-name" required>
        </div>
        <div>
          <label class="form-sublabel" for="lastName">Last Name</label>
          <input class="form-input" type="text" id="lastName" name="last_name" autocomplete="family-name" required>
        </div>
      </div>
    </fieldset>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="subject">Subject</label>
      <input class="form-input" type="text" id="subject" name="subject" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="message">Message</label>
      <textarea class="form-input" id="message" name="message" required></textarea>
    </div>

    <button class="form-submit" type="submit">Submit</button>
    <p class="form-status" id="formStatus" role="status"></p>
  </form>

  <p class="contact-note lang-ja">SNSのDMでも連絡可能です：<a href="https://www.instagram.com/daigorere/" target="_blank">Instagram</a></p>
  <p class="contact-note lang-en">You can also reach me by DM on <a href="https://www.instagram.com/daigorere/" target="_blank">Instagram</a>.</p>
</main>

<footer><p>© 2026 DAIGO SAKANE</p></footer>

<script>
(() => {
  const form = document.getElementById('contactForm');
  const status = document.getElementById('formStatus');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    status.classList.remove('error');
    const btn = form.querySelector('.form-submit');
    btn.disabled = true;
    const en = document.documentElement.lang === 'en';
    status.textContent = en ? 'Sending…' : '送信中…';
    form.elements._subject.value = '【ポートフォリオ】' + form.elements.subject.value;
    // ページ遷移させずに送るため、FormSubmit の AJAX 用エンドポイント（/ajax/）に送る
    const url = form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/');
    try {
      const res = await fetch(url, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || String(data.success) !== 'true') throw new Error(data.message || res.status);
      form.reset();
      status.textContent = en ? 'Thank you. Your message has been sent.' : '送信しました。ありがとうございます。';
    } catch (err) {
      status.classList.add('error');
      status.textContent = (en ? 'Sending failed. Please try again later. (' : '送信に失敗しました。時間をおいて再度お試しください。（') + err.message + (en ? ')' : '）');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
<script>
// 名前に数秒おきに色収差のグリッチを入れる（動きを減らす設定の閲覧者には出さない）
(() => {
  const logo = document.querySelector('nav .logo');
  if (!logo || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  logo.addEventListener('animationend', () => logo.classList.remove('rgb-glitch'));
  const fire = () => { logo.classList.remove('rgb-glitch'); void logo.offsetWidth; logo.classList.add('rgb-glitch'); setTimeout(fire, 3000 + Math.random() * 4000); };
  setTimeout(fire, 1500);
})();
</script>
<script>
// 言語切り替え：選んだ言語を記憶し、<html lang> を切り替える
(() => {
  const btn = document.querySelector('.lang-toggle');
  if (!btn) return;
  const titleJa = document.title, titleEn = document.documentElement.dataset.titleEn || titleJa;
  const apply = l => { document.documentElement.lang = l; document.title = l === 'en' ? titleEn : titleJa; btn.textContent = l === 'en' ? '日本語' : 'EN'; };
  apply(document.documentElement.lang === 'en' ? 'en' : 'ja');
  btn.addEventListener('click', () => {
    const l = document.documentElement.lang === 'en' ? 'ja' : 'en';
    apply(l);
    try { localStorage.setItem('lang', l); } catch (e) {}
  });
})();
</script>
</body>
</html>
