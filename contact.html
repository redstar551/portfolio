<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {

}
html { scroll-behavior: smooth; }
body { background: var(--black); color: var(--white); font-family: var(--font-body); font-size: 14px; line-height: 1.6; overflow-x: hidden; }
::selection { background: var(--navy); color: var(--white); }
a { color: var(--accent); text-decoration: none; transition: color 0.2s; }

/* 言語切り替え：<html lang> に応じて日本語版と英語版を出し分ける */

html[lang="en"] .lang-ja { display: none; }
html[lang="en"] .lang-en { display: revert; }
.lang-toggle { font-family: var(--font-display), var(--font-jp); font-size: 15px; letter-spacing: 2px; color: rgba(240,236,227,0.45); background: transparent; border: 1px solid rgba(240,236,227,0.22); padding: 3px 10px; cursor: pointer; text-transform: uppercase; transition: border-color 0.3s, color 0.3s; }
.lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
/* GD高速道路ゴシックJA をアウトライン化した見出し・ラベル（フォントファイルは置かず、文字の形だけを使う） */
.gd { height: 0.74em; width: auto; display: inline-block; vertical-align: -0.06em; fill: currentColor; overflow: visible; }
.gd .gd-m { fill: currentColor; }
.gd .gd-c, .gd .gd-b { opacity: 0; }
.glitch-text.glitching .gd .gd-c { opacity: 0.8; fill: cyan; animation: gt 0.3s steps(2) infinite; }
.glitch-text.glitching .gd .gd-b { opacity: 0.8; fill: #4A9EFF; animation: gb 0.3s steps(2) infinite; }
.lang-toggle:focus-visible { outline: 1px solid var(--accent); }

.scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); opacity: 0.5; }

nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
nav .logo { font-family: var(--font-dot); font-weight: 400; font-size: 18px; letter-spacing: 4px; color: rgba(240,236,227,0.8); }
/* 名前の定期グリッチ：赤と水色を左右にずらす色収差 */
@keyframes logo-rgb { 0%{text-shadow:-2px 0 rgba(255,0,70,.85),2px 0 rgba(0,220,255,.85);transform:translateX(0)} 20%{text-shadow:3px 0 rgba(255,0,70,.85),-3px 0 rgba(0,220,255,.85);transform:translateX(1px)} 40%{text-shadow:-1px 0 rgba(255,0,70,.85),1px 0 rgba(0,220,255,.85);transform:translateX(-1px)} 60%{text-shadow:2px 1px rgba(255,0,70,.85),-2px -1px rgba(0,220,255,.85);transform:translateX(0)} 80%,100%{text-shadow:none;transform:none} }
nav .logo.rgb-glitch { display: inline-block; animation: logo-rgb 0.4s steps(1); }
nav .back-link { font-family: var(--font-display); font-size: 16px; letter-spacing: 3px; color: rgba(240,236,227,0.45); text-transform: uppercase; transition: color 0.3s; }

.contact-page { max-width: 900px; margin: 0 auto; padding: 60px 40px 100px; }
.contact-title { font-family: var(--font-display); font-size: clamp(48px, 10vw, 120px); letter-spacing: 6px; color: var(--white); text-transform: uppercase; line-height: 1; margin-bottom: 60px; position: relative; display: inline-block; }

.form-group { margin-bottom: 30px; border: 0; }
.form-legend, .form-label { display: block; font-family: var(--font-body); font-size: 12px; letter-spacing: 1px; color: var(--grey); margin-bottom: 8px; }

.form-input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(240,236,227,0.25); color: var(--white); font-family: var(--font-jp); font-size: 15px; padding: 10px 0; border-radius: 0; outline: none; transition: border-color 0.25s; }

footer { padding: 30px 40px; text-align: center; font-family: var(--font-body); font-size: 11px; letter-spacing: 3px; color: rgba(240,236,227,0.4); }

<script>
(() => {
  const form = document.getElementById('contactForm');
  const status = document.getElementById('formStatus');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    status.classList.remove('error');
    const btn = form.querySelector('.form-submit');
    btn.disabled = true;
    const en = document.documentElement.lang === 'en';
    status.textContent = en ? 'Sending…' : '送信中…';
    form.elements._subject.value = '【ポートフォリオ】' + form.elements.subject.value;
    // ページ遷移させずに送るため、FormSubmit の AJAX 用エンドポイント（/ajax/）に送る
    const url = form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/');
    try {
      const res = await fetch(url, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || String(data.success) !== 'true') throw new Error(data.message || res.status);
      form.reset();
      status.textContent = en ? 'Thank you. Your message has been sent.' : '送信しました。ありがとうございます。';
    } catch (err) {
      status.classList.add('error');
      status.textContent = (en ? 'Sending failed. Please try again later. (' : '送信に失敗しました。時間をおいて再度お試しください。（') + err.message + (en ? ')' : '）');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
<script>
// 名前に数秒おきに色収差のグリッチを入れる（動きを減らす設定の閲覧者には出さない）
(() => {
  const logo = document.querySelector('nav .logo');
  if (!logo || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  logo.addEventListener('animationend', () => logo.classList.remove('rgb-glitch'));
  const fire = () => { logo.classList.remove('rgb-glitch'); void logo.offsetWidth; logo.classList.add('rgb-glitch'); setTimeout(fire, 3000 + Math.random() * 4000); };
  setTimeout(fire, 1500);
})();
</script>
<script>
// 言語切り替え：選んだ言語を記憶し、<html lang> を切り替える
(() => {
  const btn = document.querySelector('.lang-toggle');
  if (!btn) return;
  const titleJa = document.title, titleEn = document.documentElement.dataset.titleEn || titleJa;
  const apply = l => { document.documentElement.lang = l; document.title = l === 'en' ? titleEn : titleJa; };
  apply(document.documentElement.lang === 'en' ? 'en' : 'ja');
  btn.addEventListener('click', () => {
    const l = document.documentElement.lang === 'en' ? 'ja' : 'en';
    apply(l);
    try { localStorage.setItem('lang', l); } catch (e) {}
  });
})();
</script>
