<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #062C54; --navy-light: #0A4080; --accent: #4A9EFF;
  --black: #0A0A0A; --white: #F0ECE3; --cream: #E8E0D0; --grey: #888;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'Space Mono', monospace;
  --font-jp: 'Noto Sans JP', sans-serif;
  --font-dot: 'DotGothic16', sans-serif;
}
html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--navy) var(--black); }
body { background: var(--black); color: var(--white); font-family: var(--font-body); font-size: 14px; line-height: 1.6; overflow-x: hidden; cursor: crosshair; }
::selection { background: var(--navy); color: var(--white); }
a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--white); }
/* 言語切り替え：<html lang> に応じて日本語版と英語版を出し分ける */
.lang-en { display: none; }
html[lang="en"] .lang-ja { display: none; }
html[lang="en"] .lang-en { display: revert; }
.lang-toggle { font-family: var(--font-display), var(--font-jp); font-size: 15px; letter-spacing: 2px; color: rgba(240,236,227,0.45); background: transparent; border: 1px solid rgba(240,236,227,0.22); padding: 3px 10px; cursor: pointer; text-transform: uppercase; transition: border-color 0.3s, color 0.3s; }
.lang-toggle:hover { border-color: var(--accent); color: var(--accent); }
/* GD高速道路ゴシックJA をアウトライン化した見出し・ラベル（フォントファイルは置かず、文字の形だけを使う） */
.gd { height: 0.74em; width: auto; display: inline-block; vertical-align: -0.06em; fill: currentColor; overflow: visible; }
.gd .gd-m { fill: currentColor; }
.gd .gd-c, .gd .gd-b { opacity: 0; }
.glitch-text.glitching .gd .gd-c { opacity: 0.8; fill: cyan; animation: gt 0.3s steps(2) infinite; }
.glitch-text.glitching .gd .gd-b { opacity: 0.8; fill: #4A9EFF; animation: gb 0.3s steps(2) infinite; }
.lang-toggle:focus-visible { outline: 1px solid var(--accent); }
.nav-right { display: flex; align-items: center; gap: 20px; }

.scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); opacity: 0.5; }

.glitch-text { position: relative; }
.glitch-text::before, .glitch-text::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
.glitch-text::before { color: cyan; clip-path: inset(0 0 60% 0); }
.glitch-text::after { color: #4A9EFF; clip-path: inset(40% 0 0 0); }
.glitch-text.glitching::before { opacity: 0.8; animation: gt 0.3s steps(2) infinite; }
.glitch-text.glitching::after { opacity: 0.8; animation: gb 0.3s steps(2) infinite; }
@keyframes gt { 0%{transform:translate(-3px,-2px)}50%{transform:translate(2px,1px)}100%{transform:translate(-1px,1px)} }
@keyframes gb { 0%{transform:translate(3px,2px)}50%{transform:translate(-2px,-1px)}100%{transform:translate(1px,-1px)} }
.glitch-block { position: relative; }
.glitch-block.glitching { animation: bg 0.15s steps(1) infinite; }
@keyframes bg { 0%{clip-path:inset(0)}10%{clip-path:inset(20% 0 40% 0);transform:translateX(-5px)}20%{clip-path:inset(60% 0 10% 0);transform:translateX(5px)}30%,100%{clip-path:inset(0);transform:translateX(0)} }

nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 20px 40px; display: flex; justify-content: flex-end; align-items: center; mix-blend-mode: difference; }
nav .logo { font-family: var(--font-dot); font-weight: 400; font-size: 18px; letter-spacing: 4px; color: rgba(240,236,227,0.8); }
/* 名前の定期グリッチ：赤と水色を左右にずらす色収差 */
@keyframes logo-rgb { 0%{text-shadow:-2px 0 rgba(255,0,70,.85),2px 0 rgba(0,220,255,.85);transform:translateX(0)} 20%{text-shadow:3px 0 rgba(255,0,70,.85),-3px 0 rgba(0,220,255,.85);transform:translateX(1px)} 40%{text-shadow:-1px 0 rgba(255,0,70,.85),1px 0 rgba(0,220,255,.85);transform:translateX(-1px)} 60%{text-shadow:2px 1px rgba(255,0,70,.85),-2px -1px rgba(0,220,255,.85);transform:translateX(0)} 80%,100%{text-shadow:none;transform:none} }
nav .logo.rgb-glitch { display: inline-block; animation: logo-rgb 0.4s steps(1); }
.logo-br { display: none; }
nav .nav-links { display: flex; gap: 30px; list-style: none; }
nav .nav-links a { font-family: var(--font-jp); font-weight: 100; font-size: 15px; letter-spacing: 3px; color: #fff; text-transform: uppercase; position: relative; transition: opacity 0.3s; opacity: 0.85; }
nav .nav-links a:hover { opacity: 1; }
nav .nav-links a::after { content:''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.3s; }
nav .nav-links a:hover::after { width: 100%; }

/* WORKS — TOP */
#works { padding: 100px 9.5% 80px; position: relative; overflow: hidden; min-height: 100vh;
  display: flex; flex-direction: column; justify-content: safe center; }
#works::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
  background:
    linear-gradient(180deg, transparent 10%, rgba(30,60,200,0.03) 12%, transparent 14%, transparent 25%, rgba(80,0,255,0.04) 26%, rgba(0,100,255,0.03) 28%, transparent 30%, transparent 40%, rgba(100,50,255,0.05) 41%, rgba(0,150,255,0.04) 43%, rgba(255,0,100,0.02) 44%, transparent 46%, transparent 55%, rgba(0,80,255,0.03) 56%, transparent 58%, transparent 70%, rgba(60,0,200,0.04) 71%, rgba(0,200,255,0.03) 73%, transparent 75%, transparent 85%, rgba(100,0,255,0.03) 86%, transparent 88%),
    linear-gradient(155deg, transparent 20%, rgba(0,50,255,0.06) 35%, rgba(100,0,255,0.04) 45%, rgba(255,0,80,0.02) 50%, transparent 65%);
}
#works::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, rgba(74,158,255,0.15), rgba(150,0,255,0.1), transparent); z-index: 0; animation: sd 8s linear infinite; pointer-events: none; }
@keyframes sd { 0%{top:0}100%{top:100%} }

/* 障子の桟のように、カードのすき間と外枠を細い線で見せる（暗め） */
.works-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; position: relative; z-index: 1; padding: 5px; max-width: 1160px; margin: 0 auto; flex: 0 0 auto; width: 100%;
  /* 左上から光が当たる桟：明るい面と影の面をグラデーションでつくる */
  background-image: linear-gradient(135deg, rgba(240,236,227,0.26) 0%, rgba(232,224,208,0.16) 45%, rgba(120,114,104,0.14) 100%);
  box-shadow: 0 0 0 1px rgba(10,10,10,0.9), 0 16px 40px rgba(0,0,0,0.65); }
@media (min-width: 1100px) { .works-grid { grid-template-columns: repeat(4, 1fr); } }
/* 画面の縁の陰影（固定。影は動かさず、動かすのは transform と opacity だけにして滑らかに保つ） */
.works-grid::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 5;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.55), inset 0 0 140px rgba(0,0,0,0.35); }
/* カーソルを重ねるとブラウン管の表面のようにふくらむ */
.works-grid { border-radius: 14px / 11px; transform-origin: 50% 60%; transition: transform 0.5s ease; will-change: transform; }
.works-grid:hover { transform: perspective(1500px) rotateX(1.4deg) scale(1.012); }
.works-grid::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 6; opacity: 0;
  transition: opacity 0.5s ease; background: radial-gradient(120% 80% at 50% 0%, rgba(0,0,0,0.28), rgba(0,0,0,0) 55%),
    radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.45) 100%); }
.works-grid:hover::before { opacity: 1; }
.site-name { margin: 46px auto 0; text-align: center; font-family: var(--font-jp); font-weight: 100; font-size: 17px; letter-spacing: 5px; color: #fff; }
/* 広い画面では4列にしてカードを小さめに */
.work-card { position: relative; aspect-ratio: 4/3; overflow: hidden; cursor: pointer; background: #111; display: block; color: inherit; text-decoration: none;
  box-shadow: inset 3px 3px 7px rgba(0,0,0,0.9), inset -2px -2px 5px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(10,10,10,0.9); }
.work-card-inner { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; position: relative; z-index: 2; background: linear-gradient(0deg, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0.15) 50%, transparent 100%); transition: background 0.4s; }
a.work-card:hover .work-card-inner { background: linear-gradient(0deg, rgba(6,44,84,0.9) 0%, rgba(6,44,84,0.3) 60%, transparent 100%); }
.work-card .work-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.work-card .work-bg .pattern { width: 100%; height: 100%; opacity: 0.15; }
.work-card .work-bg .thumb { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
a.work-card:hover .work-bg .thumb { transform: scale(1.04); }
div.work-card { cursor: default; }
/* カードの作品名・年号：フォントポにほんご（IPAフォントライセンス v1.0 の派生）をアウトライン化 */
.work-card .cardtext { height: 1.1em; width: auto; display: block; }
.work-card .cardtext + .cardtext { margin-top: 0.02em; }
.work-card .cardtext.yr { height: 1.1em; }
.work-card h3 { font-family: var(--font-jp); font-weight: 400; font-size: 15px; letter-spacing: 0.5px; line-height: 1.4; color: var(--white); }
.work-card .work-year { font-family: var(--font-jp); font-size: 11px; letter-spacing: 0.5px; color: rgba(240,236,227,0.55); line-height: 1.2; margin-bottom: 2px; }
.work-card .work-tags { font-family: var(--font-body); font-size: 8px; letter-spacing: 1.5px; color: rgba(232,224,208,0.6); margin-top: 5px; text-transform: uppercase; }
a.work-card:hover h3 { animation: tf 0.1s steps(1) 3; }
@keyframes tf { 0%{opacity:1}50%{opacity:0.6;transform:translateX(2px)}100%{opacity:1} }

/* CONTACT */
#sns { min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 100px 40px; margin: 0; }
.contact-heading { font-family: var(--font-display); font-size: clamp(48px,10vw,120px); letter-spacing: 6px; color: var(--white); text-transform: uppercase; margin: 0 auto 30px; display: block; text-align: center; }
.contact-links { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; align-items: center; margin: 0 auto; padding: 0; list-style: none; }
.contact-link { font-family: var(--font-display); font-size: 18px; letter-spacing: 4px; text-transform: uppercase; padding: 14px 32px; transition: all 0.3s; border: 2px solid; display: inline-block; text-align: center; }
.contact-ig { color: #E1306C; border-color: #E1306C; }
.contact-ig:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: var(--white); border-color: #dc2743; }
.contact-x { color: #fff; border-color: #fff; }
.contact-x:hover { background: #fff; color: var(--black); }

/* TRAIN FOOTER */
#train-footer { padding: 60px 40px 20px; display: flex; flex-direction: column; align-items: center; background: var(--black); overflow: hidden; }
.train-wrapper { position: relative; width: 75vw; max-width: 900px; transform: rotate(-6deg); margin-bottom: 20px; cursor: pointer; }
/* 線路・架線（.train-track）は固定し、車体と車輪（.train-body）だけが走り去る */
.train-track { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
.train-body { position: relative; transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.2s ease; }
.train-wrapper:hover .train-body { transform: translateX(120vw); opacity: 0; }
.train-svg { width: 100%; height: auto; display: block; transform: scaleX(-1); }
/* 車体を埋める鉄路タイプフェイスの文字（アウトライン化。フォントファイルは置かない） */
.train-words { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

footer { padding: 25px 40px; text-align: center; font-family: var(--font-body); font-size: 11px; letter-spacing: 3px; color: rgba(240,236,227,0.4); background: var(--black); }

.reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

.glitch-bar { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; opacity: 0; }
.glitch-bar.active { animation: fg 0.2s steps(1); }
@keyframes fg { 0%{opacity:1;background:rgba(74,158,255,0.04)}15%{opacity:1;clip-path:inset(10% 0 70% 0);background:rgba(0,255,255,0.08);transform:translateX(-4px)}30%{opacity:1;clip-path:inset(50% 0 20% 0);transform:translateX(4px)}45%,100%{opacity:0;clip-path:inset(0);transform:translateX(0)} }
.glitch-stripe { position: fixed; left: 0; width: 100%; height: 4px; background: rgba(100,180,255,0.7); mix-blend-mode: screen; pointer-events: none; z-index: 9997; animation: sf 0.15s steps(1) forwards; }
@keyframes sf { 0%{opacity:0.8}50%{opacity:0.4;transform:translateX(10px)}100%{opacity:0} }

@media (max-width: 768px) {
  nav { padding: 16px 20px; } nav .nav-links { gap: 16px; } nav .nav-links a { font-size: 12px; letter-spacing: 2px; }
  .logo-br { display: inline; } nav .logo { font-size: 16px; line-height: 1.3; }
  #works { padding: 80px 7% 40px; justify-content: flex-start; } .works-grid { grid-template-columns: 1fr 1fr; gap: 4px; }
  .work-card h3 { font-size: 13px; } .work-card-inner { padding: 12px; }
    .train-wrapper { width: 95vw; transform: rotate(-4deg); }
  .contact-links { flex-direction: column; align-items: center; } #sns { padding: 80px 20px; }
}
@media (max-width: 480px) { .works-grid { grid-template-columns: 1fr; } }

<script>
(() => {
  const gb = document.getElementById('glitchBar');
  let ls = 0, gc = false, tk = false;
  window.addEventListener('scroll', () => {
    if (!tk) { requestAnimationFrame(() => {
      const s = window.scrollY, d = Math.abs(s - ls);
      if (d > 40 && !gc) { tg(d); gc = true; setTimeout(() => gc = false, 200); }
      ls = s; tk = false;
    }); tk = true; }
  });
  function tg(i) {
    gb.classList.add('active'); setTimeout(() => gb.classList.remove('active'), 200);
    for (let j = 0; j < Math.min(Math.floor(i/30),5); j++) setTimeout(() => ss(), j*30);
    document.querySelectorAll('.glitch-text').forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.top > -100 && r.top < innerHeight+100) { e.classList.add('glitching'); setTimeout(() => e.classList.remove('glitching'), 150+Math.random()*200); }
    });
    document.querySelectorAll('.glitch-block').forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.top > -100 && r.top < innerHeight+100 && Math.random()>0.5) { e.classList.add('glitching'); setTimeout(() => e.classList.remove('glitching'), 100+Math.random()*150); }
    });
  }
  function ss() { const s=document.createElement('div'); s.className='glitch-stripe'; s.style.top=Math.random()*100+'vh'; s.style.height=(2+Math.random()*6)+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),200); }
  const rv = document.querySelectorAll('.reveal');
  const ob = new IntersectionObserver(es => { es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }); }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  rv.forEach(e => ob.observe(e));
  setInterval(() => { if(Math.random()>0.85) { const ts=document.querySelectorAll('.glitch-text'), t=ts[Math.floor(Math.random()*ts.length)]; if(t){t.classList.add('glitching');setTimeout(()=>t.classList.remove('glitching'),100+Math.random()*200);} } }, 3000);
  document.querySelectorAll('nav a[href^="#"]').forEach(l => { l.addEventListener('click', e => { e.preventDefault(); document.querySelector(l.getAttribute('href'))?.scrollIntoView({behavior:'smooth',block:'start'}); }); });
})();
</script>
<script>
// 名前に数秒おきに色収差のグリッチを入れる（動きを減らす設定の閲覧者には出さない）
(() => {
  const logo = document.querySelector('nav .logo');
  if (!logo || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  logo.addEventListener('animationend', () => logo.classList.remove('rgb-glitch'));
  const fire = () => { logo.classList.remove('rgb-glitch'); void logo.offsetWidth; logo.classList.add('rgb-glitch'); setTimeout(fire, 3000 + Math.random() * 4000); };
  setTimeout(fire, 1500);
})();
</script>
<script>
// 言語切り替え：選んだ言語を記憶し、<html lang> を切り替える
(() => {
  const btn = document.querySelector('.lang-toggle');
  if (!btn) return;
  const titleJa = document.title, titleEn = document.documentElement.dataset.titleEn || titleJa;
  const apply = l => { document.documentElement.lang = l; document.title = l === 'en' ? titleEn : titleJa; };
  apply(document.documentElement.lang === 'en' ? 'en' : 'ja');
  btn.addEventListener('click', () => {
    const l = document.documentElement.lang === 'en' ? 'ja' : 'en';
    apply(l);
    try { localStorage.setItem('lang', l); } catch (e) {}
  });
})();
</script>
